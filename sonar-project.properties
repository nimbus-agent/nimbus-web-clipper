# SonarQube Cloud (SonarCloud) configuration for nimbus-web-clipper.
# Project must be imported into the `nimbus-agent` SonarCloud org and a
# SONAR_TOKEN repo secret set; the sonar.yml workflow skips analysis when the
# token is absent.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-web-clipper
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts

# dist/ is esbuild output.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts

# vitest writes coverage/lcov.info (reporter "lcov" in vitest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true
