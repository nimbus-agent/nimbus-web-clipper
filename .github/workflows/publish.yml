name: Publish Web Clipper

# Triggered by tags of the form `v0.1.0`. The tag version is written into
# package.json before building so the manifest version matches the tag, then a
# zip per browser target is attached to a GitHub Release. When store credentials
# are configured (see store/publishing.md) the store-chrome / store-firefox jobs
# upload the same artifacts to the Chrome Web Store and AMO and submit for review.
#
# Every job that touches a store credential declares `environment: release`. That
# environment's deployment branch policy admits only `v*` tags and `main`, so a
# workflow added on a feature branch cannot reach the publishing credentials.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build + attach browser zips to the GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The store credentials are environment-scoped so that only the release
    # pipeline — not every job in the repo — can read them. This job needs the
    # environment because its `Detect store secrets` step reads the credentials
    # to compute the has_cws / has_amo gates; without it those gates would
    # silently evaluate false and the store jobs would skip on every release.
    environment: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_cws: ${{ steps.store_flags.outputs.has_cws }}
      has_amo: ${{ steps.store_flags.outputs.has_amo }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
        env:
          CI: "true"

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' did not parse as semver after stripping 'v'"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Stamp package.json with the tag version
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Build bundles + manifests
        run: bun run build

      - name: Verify the build invariant
        run: bun run check-build

      - name: Lint the Firefox bundle (addons-linter)
        run: bunx web-ext lint --source-dir dist/firefox

      - name: Package per-target zips
        run: bun run package

      - name: Attach zips to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist-zip/*.zip
          tag_name: ${{ github.ref_name }}
          name: Web Clipper ${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Build source archive for AMO review
        # git archive captures the committed tree (baseline version); refresh the
        # tag-stamped package.json so a reviewer's rebuild matches the signed XPI.
        run: |
          git archive --format=zip -o "dist-zip/source-${VERSION}.zip" HEAD
          zip -q "dist-zip/source-${VERSION}.zip" package.json

      - name: Detect store secrets
        id: store_flags
        # Each store gate flips true only when ALL of that store's credentials are
        # present, so a partially-configured store skips cleanly instead of running
        # the job and failing at the CLI.
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ] && [ -n "$CWS_EXTENSION_ID" ] && [ -n "$CWS_PUBLISHER_ID" ]; then
            echo "has_cws=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cws=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "has_amo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_amo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifacts for the store jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-build
          path: |
            dist/**
            dist-zip/**
          retention-days: 1
          if-no-files-found: error

  store-chrome:
    name: Chrome Web Store — upload + publish
    needs: publish
    if: needs.publish.outputs.has_cws == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: .

      - name: Upload + publish to the Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          bunx chrome-webstore-upload \
            --source "dist-zip/nimbus-web-clipper-chrome-${{ needs.publish.outputs.version }}.zip" \
            --extension-id "$CWS_EXTENSION_ID"

  store-firefox:
    name: Firefox AMO — sign (listed) + submit
    needs: publish
    if: needs.publish.outputs.has_amo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-build
          path: .

      - name: Sign + submit the listed AMO version
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --approval-timeout 0 disables the wait for approval. A listed version is
        # gated on human review that takes days, while web-ext's default is a
        # 15-minute poll — so without this the job reports failure on every release
        # even though the submission succeeded. The version is still submitted; we
        # simply do not block CI on the review.
        run: |
          bunx web-ext sign \
            --source-dir dist/firefox \
            --channel listed \
            --approval-timeout 0 \
            --upload-source-code "dist-zip/source-${{ needs.publish.outputs.version }}.zip" \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
