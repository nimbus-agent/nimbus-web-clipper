name: Store credential check

# Read-only diagnostic. Fetches a Chrome OAuth token and calls the AMO
# profile endpoint, printing the FULL error bodies that web-ext and
# chrome-webstore-upload swallow. Uploads nothing, signs nothing, publishes
# nothing. Reports secret SHAPE (length / charset / stray whitespace) only —
# never a value.
#
# Triggered on push to its own branch so it can be proven before merge, and
# on a schedule once merged so a dead credential is found on a Tuesday
# rather than mid-release.
#
# NOTE: the store credentials are environment-scoped (`release`), whose
# deployment branch policy admits only `main` and `v*` tags. The scheduled and
# workflow_dispatch runs both come from `main`, so they are unaffected. The
# `dev/**/store-credential-check` push trigger below is now rejected by that
# policy — it was a one-off pre-merge proof and is superseded by running this
# workflow via workflow_dispatch on `main`.

on:
  push:
    branches:
      - "dev/**/store-credential-check"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Never cancel-in-progress: this is the only job in the repo that reads every
# store credential, and a half-run diagnostic is worse than a queued one.
concurrency:
  group: store-credential-check
  cancel-in-progress: false

jobs:
  check:
    name: Verify store publishing credentials
    runs-on: ubuntu-24.04
    # Three curl/openssl steps against two hosts. Anything past a couple of
    # minutes is a hang, not slowness — without this the job could hold a runner
    # for the six-hour default while holding all seven store secrets in env.
    timeout-minutes: 10
    # Required to read the environment-scoped store credentials below.
    environment: release
    steps:
      # Audit, not block: the two steps below deliberately call oauth2.googleapis.com
      # and addons.mozilla.org, so a blocking egress policy would fail the diagnostic
      # it exists to run. Audit still records where this job talked to.
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Shape check (no values printed)
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          shape() {
            local name="$1" val="$2" expect="$3"
            local len=${#val}
            local trimmed; trimmed="$(printf '%s' "$val" | tr -d '[:space:]')"
            local tlen=${#trimmed}
            local ws=$(( len - tlen ))
            printf '%-20s len=%-5s stripped_ws=%-3s %s\n' \
              "$name" "$len" "$ws" "$expect"
            if [ "$ws" -ne 0 ]; then
              echo "  ^^ WARNING: contains $ws whitespace char(s) — a stored newline/space breaks auth"
            fi
            if [ "$len" -eq 0 ]; then
              echo "  ^^ ERROR: secret is EMPTY or not set"
            fi
          }
          echo "=== secret shapes ==="
          shape CWS_CLIENT_ID     "$CWS_CLIENT_ID"     "expect ~72, ends .apps.googleusercontent.com"
          shape CWS_CLIENT_SECRET "$CWS_CLIENT_SECRET" "expect ~35, starts GOCSPX-"
          shape CWS_REFRESH_TOKEN "$CWS_REFRESH_TOKEN" "expect ~103, starts 1//"
          shape CWS_EXTENSION_ID  "$CWS_EXTENSION_ID"  "expect 32 lowercase letters"
          shape CWS_PUBLISHER_ID  "$CWS_PUBLISHER_ID"  "expect numeric-ish"
          shape AMO_JWT_ISSUER    "$AMO_JWT_ISSUER"    "expect user:<digits>:<digits>"
          shape AMO_JWT_SECRET    "$AMO_JWT_SECRET"    "expect 64+ hex"

          echo
          echo "=== prefix/suffix classes (no values) ==="
          case "$CWS_CLIENT_ID" in
            *.apps.googleusercontent.com) echo "CWS_CLIENT_ID suffix     : OK" ;;
            *) echo "CWS_CLIENT_ID suffix     : WRONG (does not end .apps.googleusercontent.com)" ;;
          esac
          case "$CWS_CLIENT_SECRET" in
            GOCSPX-*) echo "CWS_CLIENT_SECRET prefix : OK" ;;
            *) echo "CWS_CLIENT_SECRET prefix : WRONG (does not start GOCSPX-)" ;;
          esac
          case "$CWS_REFRESH_TOKEN" in
            1//*) echo "CWS_REFRESH_TOKEN prefix : OK" ;;
            *) echo "CWS_REFRESH_TOKEN prefix : WRONG (does not start 1//)" ;;
          esac
          if printf '%s' "$AMO_JWT_ISSUER" | grep -Eq '^user:[0-9]+:[0-9]+$'; then
            echo "AMO_JWT_ISSUER format    : OK"
          else
            echo "AMO_JWT_ISSUER format    : WRONG (expected user:<digits>:<digits>)"
          fi
          if printf '%s' "$AMO_JWT_SECRET" | grep -Eq '^[0-9a-f]+$'; then
            echo "AMO_JWT_SECRET charset   : OK (lowercase hex)"
          else
            echo "AMO_JWT_SECRET charset   : NOT plain lowercase hex"
          fi

      - name: Chrome Web Store — token fetch (read-only)
        if: always()
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          echo "=== POST https://oauth2.googleapis.com/token ==="
          code=$(curl -sS -o /tmp/cws.json -w '%{http_code}' \
            -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CWS_CLIENT_ID}" \
            --data-urlencode "client_secret=${CWS_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${CWS_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" || true)
          echo "HTTP $code"
          # Body carries only error codes/descriptions, never the secrets.
          sed -E 's/"access_token"[[:space:]]*:[[:space:]]*"[^"]*"/"access_token":"<redacted>"/' /tmp/cws.json
          echo
          if [ "$code" = "200" ]; then
            echo "RESULT: Chrome credentials VALID"
            grep -q 'chromewebstore' /tmp/cws.json \
              && echo "scope: chromewebstore present" \
              || echo "WARNING: chromewebstore scope MISSING — upload would still fail"
          else
            echo "RESULT: Chrome credentials REJECTED"
            echo '  invalid_client -> CLIENT_ID/CLIENT_SECRET wrong or from different clients'
            echo '  invalid_grant  -> refresh token revoked, or minted under a different client'
          fi

      - name: Firefox AMO — profile call (read-only)
        if: always()
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          hdr=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
          pay=$(printf '{"iss":"%s","jti":"%s","iat":%s,"exp":%s}' \
                "$AMO_JWT_ISSUER" "$(cat /proc/sys/kernel/random/uuid)" "$now" "$((now+60))" | b64url)
          sig=$(printf '%s' "$hdr.$pay" \
                | openssl dgst -sha256 -mac HMAC -macopt "key:$AMO_JWT_SECRET" -binary | b64url)
          echo "=== GET https://addons.mozilla.org/api/v5/accounts/profile/ ==="
          code=$(curl -sS -o /tmp/amo.json -w '%{http_code}' \
            -H "Authorization: JWT $hdr.$pay.$sig" \
            https://addons.mozilla.org/api/v5/accounts/profile/ || true)
          echo "HTTP $code"
          cat /tmp/amo.json; echo
          if [ "$code" = "200" ]; then
            echo "RESULT: AMO credentials VALID"
            echo "  ^ confirm this account OWNS the Nimbus Web Clipper listing"
          else
            echo "RESULT: AMO credentials REJECTED"
            echo '  "Unknown JWT iss (issuer)." -> issuer wrong or REVOKED (generating a new pair revokes the old)'
            echo '  "Incorrect JWT signature."  -> issuer fine, secret wrong'
          fi
