name: Bug report
description: Report a problem with the Nimbus Web Clipper extension
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For issues in the gateway/connectors, please use the
        [Nimbus](https://github.com/nimbus-agent/Nimbus) repository instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: "Chrome 126 / Firefox 128"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant details
      description: Console output from the extension's background/service-worker or popup (do NOT paste your bearer token or pairing code).
      render: shell
