<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip to Nimbus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1 class="popup__title">Nimbus Web Clipper</h1>
      <label class="popup__label" for="tags">Tags (comma-separated)</label>
      <input id="tags" class="popup__tags" type="text" placeholder="research, work" />
      <div class="popup__actions">
        <button id="clip-page" type="button">Clip page</button>
        <button id="clip-selection" type="button">Clip selection</button>
      </div>
      <section id="preview" class="preview" hidden>
        <h2 class="preview__heading">This is what gets sent</h2>
        <div id="preview-body"></div>
        <div class="preview__actions">
          <button id="preview-confirm" type="button">Send to Nimbus</button>
          <button id="preview-cancel" type="button">Cancel</button>
        </div>
      </section>
      <button id="show-related" type="button" class="popup__related">Show related</button>
      <section id="queue" class="queue" hidden>
        <h2 class="queue__heading">Waiting to sync (<span id="queue-count">0</span>)</h2>
        <div id="queue-list"></div>
        <button id="queue-retry-all" type="button" class="queue__retry-all">Retry all</button>
      </section>
      <output id="status" class="popup__status"></output>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
