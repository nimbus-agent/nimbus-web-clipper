<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nimbus Web Clipper — Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <h1>Nimbus Web Clipper</h1>
      <section class="options__pairing">
        <h2>Pair this browser</h2>
        <p>
          Run <code>nimbus clip pair</code> on the machine running your Nimbus gateway, then enter
          the 6-digit code it prints.
        </p>
        <p id="pairing-status" class="options__status">Pairing UI lands in a later release.</p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
